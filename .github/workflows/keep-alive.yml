# Supabase free tier pauses the project after ~a week without API activity,
# and a paused project drops its DNS record - the whole app dies (measured
# 2026-08-12: NXDOMAIN, sign-in and playlists gone until manual restore).
# One real REST query every 3 days keeps it awake. The anon key is the same
# one already published in index.html, so nothing new is exposed here.
name: keep-supabase-awake
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: query one row
        run: |
          KEY=$(curl -sf https://dafaspace.github.io/music-night/index.html | grep -o 'const SB_KEY = "[^"]*"' | cut -d'"' -f2)
          test -n "$KEY"
          curl -sf -o /dev/null \
            "https://rqruaqoecvpythbvnozf.supabase.co/rest/v1/track_links?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
